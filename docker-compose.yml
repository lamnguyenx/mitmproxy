services:
  mm:
    image: lamnguyenx/mitmweb-dev:2025-02-12
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./mitmproxy:/app/mitmproxy
      - ./web:/app/web
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
      - ./exp/mitmweb/conf_dir:/conf_dir
      - /app/__pycache__
      - /app/.pytest_cache
      - /app/web/node_modules
    ports:
      - "8010:8010"
      - "8011:8011"
    environment:
      PYTHONPATH: /app
      UV_PYTHON: /opt/conda/bin/python
    command:
      - /bin/bash
      - -c
      - "source .venv/bin/activate && cd web && gulp prod && cd .. && mitmweb --web-host 0.0.0.0 --web-port 8011 --listen-port 8010 --set web_password=\"1\" --set confdir=/conf_dir --set block_global=false"
